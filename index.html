```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>인천논현중학교 비공식 홈페이지</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Noto Sans KR", Arial, sans-serif;
    background: #f5f7fa;
    color: #20242a;
}

/* =========================
   HEADER
========================= */

header {
    background: linear-gradient(135deg, #145da0, #1984d8);
    color: white;
    padding: 28px 20px;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo-icon {
    width: 55px;
    height: 55px;
    background: white;
    color: #1769aa;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
}

.logo h1 {
    margin: 0;
    font-size: 23px;
}

.logo p {
    margin: 4px 0 0;
    opacity: 0.85;
    font-size: 13px;
}

.warning {
    background: rgba(255,255,255,0.15);
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 12px;
}

/* =========================
   NAV
========================= */

nav {
    background: white;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav-inner {
    max-width: 1200px;
    margin: auto;
    display: flex;
}

nav button {
    border: none;
    background: transparent;
    padding: 17px 23px;
    font-size: 15px;
    cursor: pointer;
    color: #333;
}

nav button:hover {
    background: #edf6ff;
    color: #1466a5;
}

/* =========================
   MAIN
========================= */

main {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

.hero {
    background: white;
    border-radius: 18px;
    padding: 42px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.07);
    margin-bottom: 25px;
}

.hero h2 {
    margin: 0 0 10px;
    font-size: 31px;
}

.hero p {
    color: #666;
}

.date-box {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 15px;
    background: #edf6ff;
    color: #1265a5;
    border-radius: 8px;
    font-weight: bold;
}

/* =========================
   GRID
========================= */

.grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.07);
}

.card h2 {
    margin-top: 0;
}

/* =========================
   NOTICE
========================= */

.notice-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.notice-list li {
    border-bottom: 1px solid #eee;
    padding: 14px 4px;
    cursor: pointer;
}

.notice-list li:hover {
    color: #1769aa;
}

.notice-date {
    float: right;
    color: #999;
    font-size: 13px;
}

/* =========================
   QUICK MENU
========================= */

.quick {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.quick button {
    border: none;
    background: #f1f6fa;
    padding: 18px 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
}

.quick button:hover {
    background: #dceefc;
}

/* =========================
   PAGE
========================= */

#page {
    margin-top: 25px;
}

.page-card {
    background: white;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.07);
}

.page-card h2 {
    margin-top: 0;
}

.info-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

.info-table th,
.info-table td {
    border: 1px solid #ddd;
    padding: 13px;
    text-align: left;
}

.info-table th {
    background: #f3f7fa;
    width: 25%;
}

/* =========================
   CALENDAR
========================= */

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-top: 20px;
}

.calendar div {
    background: #f5f7f9;
    min-height: 65px;
    padding: 8px;
    border-radius: 6px;
}

.calendar .day {
    background: #1769aa;
    color: white;
    min-height: auto;
    text-align: center;
}

/* =========================
   FOOTER
========================= */

footer {
    margin-top: 60px;
    background: #20252b;
    color: #aaa;
    text-align: center;
    padding: 35px 20px;
    font-size: 13px;
}

footer strong {
    color: white;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 750px) {

    .header-inner {
        display: block;
    }

    .warning {
        margin-top: 15px;
        display: inline-block;
    }

    .nav-inner {
        overflow-x: auto;
    }

    nav button {
        white-space: nowrap;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .hero {
        padding: 28px 22px;
    }

    .hero h2 {
        font-size: 25px;
    }

    .calendar div {
        min-height: 45px;
        font-size: 12px;
    }
}
</style>
</head>


<body>

<!-- =========================
     HEADER
========================= -->

<header>

<div class="header-inner">

    <div class="logo">

        <div class="logo-icon">
            🏫
        </div>

        <div>
            <h1>인천논현중학교</h1>
            <p>비공식 학생 정보 사이트</p>
        </div>

    </div>

    <div class="warning">
        ⚠ 공식 홈페이지가 아닌 개인 제작 사이트입니다.
    </div>

</div>

</header>


<!-- =========================
     NAV
========================= -->

<nav>

<div class="nav-inner">

    <button onclick="home()">홈</button>
    <button onclick="schoolInfo()">학교소개</button>
    <button onclick="schedule()">학사일정</button>
    <button onclick="meal()">급식</button>
    <button onclick="notices()">공지사항</button>

</div>

</nav>


<!-- =========================
     MAIN
========================= -->

<main>

<div id="homePage">

    <section class="hero">

        <h2>인천논현중학교</h2>

        <p>
            학교 생활에 필요한 정보를 한곳에서 확인해보세요.
        </p>

        <div class="date-box" id="today"></div>

    </section>


    <div class="grid">

        <!-- 공지 -->

        <section class="card">

            <h2>📢 최근 소식</h2>

            <ul class="notice-list">

                <li onclick="notices()">
                    학교 공지사항을 확인하세요.
                    <span class="notice-date">공지</span>
                </li>

                <li onclick="schedule()">
                    학사일정을 확인할 수 있습니다.
                    <span class="notice-date">일정</span>
                </li>

                <li onclick="meal()">
                    오늘의 급식 메뉴
                    <span class="notice-date">급식</span>
                </li>

            </ul>

        </section>


        <!-- 빠른 메뉴 -->

        <section class="card">

            <h2>⚡ 빠른 메뉴</h2>

            <div class="quick">

                <button onclick="schoolInfo()">
                    🏫<br>학교정보
                </button>

                <button onclick="schedule()">
                    📅<br>학사일정
                </button>

                <button onclick="meal()">
                    🍚<br>급식
                </button>

                <button onclick="notices()">
                    📢<br>공지사항
                </button>

            </div>

        </section>

    </div>

</div>


<!-- 페이지 내용 -->

<div id="page"></div>


</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <strong>인천논현중학교 비공식 사이트</strong>

    <br><br>

    본 사이트는 개인이 제작한 비공식 정보 사이트입니다.

    <br>

    학교의 공식 홈페이지가 아니며 학교를 대표하지 않습니다.

</footer>


<script>

/* =========================
   날짜
========================= */

const now = new Date();

const year = now.getFullYear();
const month = now.getMonth() + 1;
const day = now.getDate();

document.getElementById("today").textContent =
    `${year}년 ${month}월 ${day}일`;


/* =========================
   홈
========================= */

function home() {

    document.getElementById("homePage").style.display = "block";

    document.getElementById("page").innerHTML = "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   학교소개
========================= */

function schoolInfo() {

    document.getElementById("homePage").style.display = "none";

    document.getElementById("page").innerHTML = `

        <section class="page-card">

            <h2>🏫 학교소개</h2>

            <p>
                인천논현중학교의 기본 정보를 확인할 수 있습니다.
            </p>

            <table class="info-table">

                <tr>
                    <th>학교명</th>
                    <td>인천논현중학교</td>
                </tr>

                <tr>
                    <th>학교 구분</th>
                    <td>중학교</td>
                </tr>

                <tr>
                    <th>설립 구분</th>
                    <td>공립</td>
                </tr>

                <tr>
                    <th>주소</th>
                    <td>인천광역시 남동구 포구로 118</td>
                </tr>

                <tr>
                    <th>대표전화</th>
                    <td>032-446-7910</td>
                </tr>

            </table>

            <br>

            <p>
                ※ 학교 기본정보는 공개된 자료를 참고하여 작성했습니다.
            </p>

        </section>

    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   학사일정
========================= */

function schedule() {

    document.getElementById("homePage").style.display = "none";

    document.getElementById("page").innerHTML = `

        <section class="page-card">

            <h2>📅 학사일정</h2>

            <p>
                아래 영역에 실제 학교 일정을 추가할 수 있습니다.
            </p>

            <div class="calendar">

                <div class="day">월</div>
                <div class="day">화</div>
                <div class="day">수</div>
                <div class="day">목</div>
                <div class="day">금</div>
                <div class="day">토</div>
                <div class="day">일</div>

                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
                <div>7</div>

                <div>8</div>
                <div>9</div>
                <div>10</div>
                <div>11</div>
                <div>12</div>
                <div>13</div>
                <div>14</div>

                <div>15</div>
                <div>16</div>
                <div>17</div>
                <div>18</div>
                <div>19</div>
                <div>20</div>
                <div>21</div>

            </div>

            <br>

            <p>
                실제 학사일정은 학교 공식 홈페이지 또는
                나이스 등의 공개 정보를 확인해 입력하는 방식으로 확장할 수 있습니다.
            </p>

        </section>

    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   급식
========================= */

function meal() {

    document.getElementById("homePage").style.display = "none";

    document.getElementById("page").innerHTML = `

        <section class="page-card">

            <h2>🍚 오늘의 급식</h2>

            <p>
                현재는 테스트 화면입니다.
            </p>

            <hr>

            <h3>🍴 오늘의 메뉴</h3>

            <ul>

                <li>밥</li>
                <li>국</li>
                <li>메인 메뉴</li>
                <li>반찬</li>
                <li>김치</li>

            </ul>

            <p>
                나중에 급식 API를 연결하면
                실제 메뉴가 자동으로 표시되도록 만들 수 있습니다.
            </p>

        </section>

    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   공지사항
========================= */

function notices() {

    document.getElementById("homePage").style.display = "none";

    document.getElementById("page").innerHTML = `

        <section class="page-card">

            <h2>📢 공지사항</h2>

            <p>
                개인 제작 사이트의 공지 영역입니다.
            </p>

            <ul class="notice-list">

                <li>
                    인천논현중학교 비공식 사이트 오픈
                    <span class="notice-date">NEW</span>
                </li>

                <li>
                    사이트 제작 테스트
                    <span class="notice-date">-</span>
                </li>

                <li>
                    새로운 기능 준비 중
                    <span class="notice-date">-</span>
                </li>

            </ul>

        </section>

    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

</script>

</body>
</html>
